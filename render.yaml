services:
  - type: worker
    name: margin-anomaly-monitor
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic upgrade head && python -m app.main"
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: margin-anomaly-db
          property: connectionString
      - key: BORROW_PROVIDER
        value: html
      - key: BORROW_HTML_URL
        value: https://bbm.iflint.pro/
      - key: COLLECTION_INTERVAL_SECONDS
        value: "30"
      - key: BORROW_DATA_MAX_AGE_MINUTES
        value: "15"
      - key: LOG_LEVEL
        value: INFO
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: margin-anomaly-db
    plan: basic-256mb
    region: frankfurt
    databaseName: margin_monitor
    user: margin_monitor
    ipAllowList: []

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: margin_monitor
      POSTGRES_USER: margin_monitor
      POSTGRES_PASSWORD: margin_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin_monitor -d margin_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://margin_monitor:margin_monitor@postgres:5432/margin_monitor
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.main"]
    restart: unless-stopped

volumes:
  postgres_data:
